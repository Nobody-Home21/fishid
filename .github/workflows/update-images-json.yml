name: Update images.json

on:
  push:
    paths:
      - 'fishinfo.json'
      - '.github/workflows/update-images-json.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-images-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate images.json
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $fishInfoPath = "fishinfo.json"
          $outputPath = "images.json"
          $commitSha = "${{ github.sha }}"
          $baseUrl = "https://raw.githubusercontent.com/${{ github.repository }}/$commitSha/cards/"

          if (-not (Test-Path $fishInfoPath)) {
              throw "fishinfo.json not found."
          }

          $raw = Get-Content $fishInfoPath -Raw | ConvertFrom-Json

          $images = foreach ($item in $raw.PSObject.Properties) {
              $imageName = [string]$item.Value.Image

              if (-not [string]::IsNullOrWhiteSpace($imageName)) {
                  [PSCustomObject]@{
                      fileName = $imageName
                      url      = "$baseUrl$imageName"
                  }
              }
          }

          $images = $images | Sort-Object fileName -Unique
          $images | ConvertTo-Json -Depth 5 | Set-Content $outputPath -Encoding UTF8

      - name: Commit updated images.json
        shell: bash
        run: |
          if git diff --quiet -- images.json; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images.json
          git commit -m "Auto-update images.json"
          git push